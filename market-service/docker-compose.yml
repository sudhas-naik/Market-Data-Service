services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  market-service:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Use Postgres container name as host (not localhost, not postgres)
      DATABASE_URL: postgresql+asyncpg://admin:persona_321_739_pass@persona-user-db:5432/market_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default                        # talk to redis
      - persona-ai-user-service_default  # talk to persona-user-db
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    restart: unless-stopped

networks:
  persona-ai-user-service_default:
    external: true
    name: persona-ai-user-service_default